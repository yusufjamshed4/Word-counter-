<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Counter Tool</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <i class="fa-solid fa-file-word"></i>
                <span>Word Counter</span>
            </div>
            <button id="themeToggle" class="icon-btn" title="Toggle Theme">
                <i class="fa-solid fa-moon"></i>
            </button>
        </header>

        <!-- Main Content -->
        <main>
            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-number" id="wordCount">0</span>
                    <span class="stat-label">Words</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="charCount">0</span>
                    <span class="stat-label">Characters</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="sentenceCount">0</span>
                    <span class="stat-label">Sentences</span>
                </div>
                <div class="stat-card">
                    <span class="stat-number" id="paragraphCount">0</span>
                    <span class="stat-label">Paragraphs</span>
                </div>
            </div>

            <!-- Input Area -->
            <div class="textarea-wrapper">
                <textarea id="textInput" placeholder="Type or paste your text here..."></textarea>
            </div>

            <!-- Action Buttons -->
            <div class="action-bar">
                <button id="copyBtn" class="btn btn-secondary">
                    <i class="fa-regular fa-copy"></i> Copy Text
                </button>
                <button id="clearBtn" class="btn btn-danger">
                    <i class="fa-solid fa-trash"></i> Clear Text
                </button>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Handled by <strong>Yusuf Jamshed</strong></p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
